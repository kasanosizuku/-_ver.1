<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - 2分間バケツ避けサバイバル</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB; /* 空の背景色 */
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      z-index: 10;
    }
    #player {
      position: absolute;
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    /* 落ちてくるバケツの画像用スタイル */
    .bucket {
      position: absolute;
      width: 45px;
      height: 45px;
      object-fit: contain;
    }
    /* 結果表示画面（ゲームオーバー / クリア共通） */
    #result-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 32px;
      font-weight: bold;
      display: none;
      text-align: center;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="info">残り時間: 2:00 | バケツ数: 3 | ブースト: OFF</div>
  <img id="player" src="walk1.jpg" alt="まっくろくろすけ">
  
  <div id="result-screen">
    <span id="result-text">GAME OVER 🔥</span><br>
    <span style="font-size: 18px; font-weight: normal; color: #ddd;">画面をリロードして再挑戦！</span>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const player = document.getElementById('player');
    const info = document.getElementById('info');
    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false;
    let isGameOver = false;

    // 制限時間（2分 = 120秒）
    let timeLeft = 120;
    let timerCounter = 0;

    // アニメーション管理
    let animTimer = 0;
    let rightFrameIndex = 0;
    let leftFrameIndex = 0;
    let currentDirection = 'right';

    // 最大15個までのバケツを管理する配列（最初は3個からスタートし、時間経過で増殖）
    const buckets = [];
    const maxBuckets = 15;
    let activeBucketCount = 3; // 初期バケツ数

    for (let i = 0; i < maxBuckets; i++) {
      const img = document.createElement('img');
      img.src = 'bucket.png'; // バケツの画像ファイル名
      img.className = 'bucket';
      // 最初は最初の3個以外は非表示にしておく
      if (i >= activeBucketCount) {
        img.style.display = 'none';
      }
      document.body.appendChild(img);
      
      buckets.push({
        element: img,
        x: Math.random() * (window.innerWidth - 45),
        y: -Math.random() * window.innerHeight,
        speed: 3 + Math.random() * 3
      });
    }

    // Firebase からデータを受信
    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false;
      }
    });

    // 1秒ごとに残り時間を減らし、難易度（バケツの数）を増やすタイマー
    setInterval(() => {
      if (isGameOver) return;

      timeLeft--;
      timerCounter++;

      // 10秒経過するごとに、落ちてくるバケツの数を1個ずつ増やす（最大15個まで）
      if (timerCounter % 10 === 0 && activeBucketCount < maxBuckets) {
        activeBucketCount++;
        // 増えた分のバケツを表示状態にする
        buckets[activeBucketCount - 1].element.style.display = 'block';
      }

      // 2分（120秒）経過したらクリア！
      if (timeLeft <= 0) {
        isGameOver = true;
        resultText.innerHTML = "CLEAR!! 🎊<br><span style='font-size:20px;'>おめでとう！2分間生き残りました！</span>";
        resultScreen.style.display = 'block';
      }
    }, 1000);

    // 画面の更新（ゲームループ）
    function update() {
      if (isGameOver) return;

      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      let smoothness = boostActive ? 0.3 : 0.02; 

      let prevX = posX;
      let prevY = posY;

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      // 画面外制限
      posX = Math.max(0, Math.min(window.innerWidth - 100, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 100, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- バケツの落下と当たり判定の処理 ---
      for (let i = 0; i < activeBucketCount; i++) {
        let b = buckets[i];
        b.y += b.speed;
        
        // 画面の下まで落ちたら上部に戻す
        if (b.y > window.innerHeight) {
          b.y = -50;
          b.x = Math.random() * (window.innerWidth - 45);
          b.speed = 3 + Math.random() * 3;
        }

        b.element.style.left = b.x + 'px';
        b.element.style.top = b.y + 'px';

        // 当たり判定
        let hitMargin = 25;
        if (
          posX + hitMargin < b.x + 45 &&
          posX + 100 - hitMargin > b.x &&
          posY + hitMargin < b.y + 45 &&
          posY + 100 - hitMargin > b.y
        ) {
          // バケツに当たったらゲームオーバー
          isGameOver = true;
          resultText.innerHTML = "GAME OVER 🔥<br><span style='font-size:18px; font-weight:normal; color:#ddd;'>バケツに当たってしまった…！</span>";
          resultScreen.style.display = 'block';
        }
      }

      // 画面上の表示更新（残り時間と現在のバケツ数）
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      let formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
      info.textContent = `残り時間: ${minutes}:${formattedSeconds} | バケツ数: ${activeBucketCount} | ブースト: ${boostActive ? '🔥 ON' : 'OFF'}`;

      // --- 左右の向きと歩行アニメーション制御 ---
      let moveDelta = posX - prevX;
      if (Math.abs(moveDelta) > 0.001) {
        if (moveDelta > 0) currentDirection = 'right';
        else if (moveDelta < 0) currentDirection = 'left';
      }

      let movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      if (movedDistance > 0.05) {
        animTimer++;
        let interval = boostActive ? 3 : 10; 

        if (animTimer > interval) {
          if (currentDirection === 'right') {
            rightFrameIndex = (rightFrameIndex + 1) % 4;
            player.src = `walk${rightFrameIndex + 1}.jpg`;
          } else {
            leftFrameIndex = (leftFrameIndex + 1) % 4;
            player.src = `walk${5 + leftFrameIndex}.jpg`;
          }
          animTimer = 0;
        }
      } else {
        player.src = (currentDirection === 'right') ? 'walk1.jpg' : 'walk5.jpg';
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

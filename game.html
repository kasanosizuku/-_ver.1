<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - 飛び出すバケツ避けサバイバル</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB; /* 空の背景色 */
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      z-index: 10;
    }
    /* まっくろくろすけ（160px） */
    #player {
      position: absolute;
      width: 160px;
      height: 160px;
      object-fit: contain;
      z-index: 5;
    }
    /* バケツ落下前の警告マーカー */
    .warning-sign {
      position: absolute;
      width: 80px;
      height: 30px;
      background: rgba(255, 0, 0, 0.4);
      border: 2px dashed red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 1;
    }
    /* 飛び出してくるバケツ */
    .bucket {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 4;
    }
    /* バケツの残像スタイル */
    .bucket-afterimage {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 0.25s ease-out;
    }
    #result-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 32px;
      font-weight: bold;
      display: none;
      text-align: center;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="info">残り時間: 0:30 | バケツ数: 3 | ブースト: OFF</div>
  <img id="player" src="walk1.png" alt="まっくろくろすけ">
  
  <div id="result-screen">
    <span id="result-text">めいに捕まった。。。</span><br>
    <span style="font-size: 18px; font-weight: normal; color: #ddd;"></span>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const player = document.getElementById('player');
    const info = document.getElementById('info');
    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false;
    let isGameOver = false;

    let timeLeft = 30; // 制限時間30秒
    let timerCounter = 0;

    let animTimer = 0;
    let rightFrameIndex = 0;
    let leftFrameIndex = 0;
    let currentDirection = 'right';

    // バケツシステムの管理
    const buckets = [];
    const maxBuckets = 15;
    let activeBucketCount = 3;

    for (let i = 0; i < maxBuckets; i++) {
      const warningEl = document.createElement('div');
      warningEl.className = 'warning-sign';
      document.body.appendChild(warningEl);

      const img = document.createElement('img');
      img.src = 'bucket.png';
      img.className = 'bucket';
      document.body.appendChild(img);
      
      buckets.push({
        warningElement: warningEl,
        element: img,
        x: Math.random() * (window.innerWidth - 200) + 100,
        y: Math.random() * (window.innerHeight - 200) + 100,
        state: 'warning',
        timer: 0,
        scale: 0.1,
        speed: 0.004,
        afterimageCounter: 0
      });
    }

    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false;
      }
    });

    setInterval(() => {
      if (isGameOver) return;

      timeLeft--;
      timerCounter++;

      if (timerCounter % 10 === 0 && activeBucketCount < maxBuckets) {
        activeBucketCount++;
      }

      if (timeLeft <= 0) {
        isGameOver = true;
        resultText.innerHTML = "めいから逃げ切った！";
        resultScreen.style.display = 'block';
      }
    }, 1000);

    function update() {
      if (isGameOver) return;

      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      let smoothness = boostActive ? 0.3 : 0.02; 

      let prevX = posX;
      let prevY = posY;

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      posX = Math.max(0, Math.min(window.innerWidth - 160, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 160, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- 影の拡大とバケツの出現処理 ---
      for (let i = 0; i < activeBucketCount; i++) {
        let b = buckets[i];

        if (b.state === 'warning') {
          // 1. 警告フェーズ：影が大きく・濃くなっていく
          b.timer++;
          let progress = b.timer / 90; // 約1.5秒間

          b.warningElement.style.display = 'block';
          b.warningElement.style.left = b.x + 'px';
          b.warningElement.style.top = b.y + 'px';

          let warningWidth = 30 + progress * 120;
          let warningHeight = 10 + progress * 50;
          b.warningElement.style.width = warningWidth + 'px';
          b.warningElement.style.height = warningHeight + 'px';

          b.warningElement.style.backgroundColor = `rgba(255, 0, 0, ${0.1 + progress * 0.7})`;
          b.warningElement.style.opacity = 0.2 + progress * 0.8;

          b.element.style.display = 'none';

          if (b.timer >= 90) {
            b.state = 'falling';
            b.timer = 0;
            b.warningElement.style.display = 'none';
            b.element.style.display = 'block';
          }

        } else if (b.state === 'falling') {
          // 2. バケツ出現・滞留フェーズ
          b.timer++;

          let finalSize = 500; // バケツの表示サイズ
          b.element.style.width = finalSize + 'px';
          b.element.style.height = finalSize + 'px';
          b.element.style.left = b.x + 'px';
          b.element.style.top = b.y + 'px';

          // ★消える直前に少しだけフェードアウト（徐々に薄くなる）効果を演出
          if (b.timer > 45) {
            b.element.style.opacity = (60 - b.timer) / 15; // 45〜60フレームの間でじわっと消える
          } else {
            b.element.style.opacity = 1.0;
          }

          // 当たり判定（表示されている間中ずっと有効）
          let playerCenterX = posX + 30;
          let playerCenterY = posY + 30;
          let distance = Math.hypot(playerCenterX - b.x, playerCenterY - b.y);

          let bucketRadius = finalSize / 4;
          let playerRadius = 20; 

          if (distance < (bucketRadius + playerRadius)) {
            isGameOver = true;
            resultText.innerHTML = "めいに捕まった。。。";
            resultScreen.style.display = 'block';
          }

          // ★表示時間を「60フレーム（約1秒間）」に延ばして残るように修正
          if (b.timer > 60) {
            b.state = 'warning';
            b.timer = 0;
            b.x = Math.random() * (window.innerWidth - 200) + 100;
            b.y = Math.random() * (window.innerHeight - 200) + 100;
          }
        }
      }

      // --- タイマー表示 ---
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      let formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
      info.textContent = `残り時間: ${minutes}:${formattedSeconds} | バケツ数: ${activeBucketCount} | ブースト: ${boostActive ? '🔥 ON' : 'OFF'}`;

      // --- 左右の向きと歩行アニメーション制御 ---
      let moveDelta = posX - prevX;
      if (Math.abs(moveDelta) > 0.001) {
        if (moveDelta > 0) currentDirection = 'right';
        else if (moveDelta < 0) currentDirection = 'left';
      }

      let movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      if (movedDistance > 0.05) {
        animTimer++;
        let interval = boostActive ? 3 : 10; 

        if (animTimer > interval) {
          if (currentDirection === 'right') {
            rightFrameIndex = (rightFrameIndex + 1) % 4;
            player.src = `walk${rightFrameIndex + 1}.png`;
          } else {
            leftFrameIndex = (leftFrameIndex + 1) % 4;
            player.src = `walk${5 + leftFrameIndex}.png`;
          }
          animTimer = 0;
        }
      } else {
        player.src = (currentDirection === 'right') ? 'walk1.png' : 'walk5.png';
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

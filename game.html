<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - ゲーム画面</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB; /* 空の背景色 */
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    #player {
      position: absolute;
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div id="info">スマホからのデータ受信待機中...</div>
  <img id="player" src="walk1.jpg" alt="まっくろくろすけ">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const player = document.getElementById('player');
    const info = document.getElementById('info');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false;

    // アニメーション管理用
    let animTimer = 0;
    let rightFrameIndex = 0; // 右移動用 (0〜3 → walk1〜4)
    let leftFrameIndex = 0;  // 左移動用 (0〜3 → walk5〜8)
    let currentDirection = 'right'; // 向きを記憶する変数

    // Firebase からデータを受信
    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false;
        info.textContent = `まっくろくろすけ出撃中 [ブースト: ${boostActive ? 'ON 🔥' : 'OFF'}]`;
      }
    });

    // 画面の更新（ゲームループ）
    function update() {
      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      let smoothness = boostActive ? 0.3 : 0.02; 

      let prevX = posX;
      let prevY = posY;

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      // 画面外制限
      posX = Math.max(0, Math.min(window.innerWidth - 100, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 100, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- 向きの判定（左右どちらに進んでいるか） ---
      let moveDelta = posX - prevX;
      if (Math.abs(moveDelta) > 0.01) {
        if (moveDelta > 0) {
          currentDirection = 'right';
        } else {
          currentDirection = 'left';
        }
      }

      // --- 歩行アニメーションの制御 ---
      let movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      
      if (movedDistance > 0.05) {
        animTimer++;
        let interval = boostActive ? 3 : 10; 

        if (animTimer > interval) {
          if (currentDirection === 'right') {
            // 右に行くときは walk1.jpg 〜 walk4.jpg をループ
            rightFrameIndex = (rightFrameIndex + 1) % 4;
            player.src = `walk${rightFrameIndex + 1}.jpg`;
          } else {
            // 左に行くときは walk5.jpg 〜 walk8.jpg をループ
            leftFrameIndex = (leftFrameIndex + 1) % 4;
            player.src = `walk${5 + leftFrameIndex}.jpg`;
          }
          animTimer = 0;
        }
      } else {
        // 止まっているときは、直前を向いていたときのポーズで静止
        player.src = (currentDirection === 'right') ? 'walk1.jpg' : 'walk5.jpg';
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

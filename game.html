<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メインゲーム画面</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
    }
    #witch {
      position: absolute;
      width: 60px;
      height: 60px;
      background-color: #8e44ad;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <div id="info">スマホからのデータ受信待機中...</div>
  <div id="witch"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const witch = document.getElementById('witch');
    const info = document.getElementById('info');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false; // ブースト状態

    // Firebase からデータを受信
    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false; // ブースト状態を受け取る
        info.textContent = `受信中 [ブースト: ${boostActive ? 'ON' : 'OFF'}]`;
      }
    });

    // 画面の更新（ゲームループ）
    function update() {
      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      // ★ここがポイント：通常時は「0.04」でかなりゆっくり、ブースト時は「0.3」でキビキビ動かす
      let smoothness = boostActive ? 0.3 : 0.01; 

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      // 画面外制限
      posX = Math.max(0, Math.min(window.innerWidth - 60, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 60, posY));

      witch.style.left = posX + 'px';
      witch.style.top = posY + 'px';

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

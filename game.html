<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - 飛び出すバケツ避けサバイバル</title>
  <!-- 待機画面のスタイルは menu.css、こんぺいとう・めいの手・練習の説明のスタイルは game-parts.css -->
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="game-parts.css">
  <style>
    /* 背景が画面全体を基準に配置されるよう、高さを画面いっぱいにする */
    html {
      height: 100%;
    }
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      z-index: 10;
      display: none;
    }
    /* まっくろくろすけ（160px） */
    #player {
      position: absolute;
      width: 160px;
      height: 160px;
      object-fit: contain;
      z-index: 5;
      display: none;
    }
    /* バケツ落下前の警告マーカー */
    .warning-sign {
      position: absolute;
      width: 80px;
      height: 30px;
      background: rgba(255, 0, 0, 0.4);
      border: 2px dashed red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 1;
    }
    /* 飛び出してくるバケツ */
    .bucket {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 4;
    }
    /* バケツの残像スタイル */
    .bucket-afterimage {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 0.25s ease-out;
    }

    /* ===== 共通ボタン（待機画面・結果画面・練習の説明で共用） ===== */
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .main-btn {
      border: none;
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #5b8c3a;
      box-shadow: 0 4px 0 #3f6b2a;
      transition: transform 0.1s, background 0.2s;
    }
    .main-btn:hover { background: #68a044; transform: scale(1.03); }
    .sub-btn {
      border: 2px solid #b9a77a;
      border-radius: 16px;
      padding: 10px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #6b5a3a;
      background: transparent;
    }
    .sub-btn:hover { background: #efe6c8; }

    /* ===== カウントダウン ===== */
    #countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 140px;
      font-weight: bold;
      white-space: nowrap;
      text-align: center;
      color: white;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.8), 0 0 4px black;
      z-index: 150;
      pointer-events: none;
      display: none;
    }

    /* ===== 練習モード終了ボタン ===== */
    #btn-quit-practice {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: rgba(138, 106, 67, 0.92);
      display: none;
    }
    #btn-quit-practice:hover { background: #6e5232; }

    /* ===== 結果画面 ===== */
    #result-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fbf5e3;
      color: #4a4130;
      border: 4px solid #8a6a43;
      box-shadow:
        0 12px 32px rgba(10, 30, 18, 0.5),
        inset 0 0 0 7px #fbf5e3,
        inset 0 0 0 9px #d9cca6;
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic', 'Meiryo', sans-serif;
      padding: 30px 50px;
      border-radius: 28px;
      display: none;
      text-align: center;
      z-index: 100;
      max-width: 80vw;
    }
    #result-title { font-size: 32px; font-weight: bold; color: #3f6b3a; }
    /* 待機画面と同じどんぐり（絵の定義は menu.css） */
    #result-title::before {
      content: '';
      display: inline-block;
      width: 30px;
      height: 38px;
      background: var(--acorn-a) center / contain no-repeat;
      vertical-align: -8px;
      margin-right: 10px;
    }
    #result-sub {
      font-size: 18px;
      font-weight: normal;
      color: #6b5a3a;
      margin: 14px 0 0;
      line-height: 1.7;
      white-space: pre-line;
    }
    #result-rank {
      display: none;
      margin: 14px 0 0;
      font-size: 22px;
      font-weight: bold;
      color: #8a5a1c;
    }
    #result-rank small { display: block; font-size: 13px; font-weight: normal; color: #8a7a55; }
    /* 被弾時の画面ゆれ */
    body.shake { animation: screen-shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes screen-shake {
      10%, 90% { transform: translate(-2px, 1px); }
      20%, 80% { transform: translate(5px, -3px); }
      30%, 50%, 70% { transform: translate(-9px, 4px); }
      40%, 60% { transform: translate(9px, -4px); }
    }
    /* クリア時の紙吹雪 */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      z-index: 90;
      pointer-events: none;
      opacity: 0.95;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg) rotateY(0deg); }
      100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)) rotateY(720deg); }
    }
    #result-buttons { margin-top: 22px; display: flex; gap: 12px; justify-content: center; }
  </style>
</head>

<body>

  <div id="info">残り時間: 0:30 | スコア: 0 | バケツ数: 3 | ブースト: OFF</div>
  <button id="btn-quit-practice">練習を終了</button>
  <img id="player" src="walk1.png" alt="まっくろくろすけ">

  <div id="countdown"></div>

  <!-- 待機画面（見た目は menu.css、動作は menu.js） -->
  <div id="menu">
    <div class="panel">
      <h1>君のまっくろくろすけ</h1>
      <p class="subtitle">飛び出すバケツ避けサバイバル</p>

      <div class="section">
        <div class="section-title">モード</div>
        <div class="btn-row">
          <button class="choice selected" data-mode="normal">通常モード<small>30秒間、逃げ切れ！</small></button>
          <button class="choice" data-mode="practice">練習モード<small>時間無制限・バケツ数固定</small></button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">ステージ</div>
        <div class="btn-row">
          <button class="choice selected" data-stage="1">ステージ1<small>飛び出すバケツ</small></button>
          <button class="choice" data-stage="2">ステージ2<small>めいの両手がはさみうち！</small></button>
        </div>
      </div>

      <div class="howto">
        <b>遊び方</b><br>
        ・スマホを傾けると、その方向に進み続けます。<br>
        ・<b>ピンクのこんぺいとう</b>をひろうと、少しの間ブースト（スピード2倍）！<br>
        ・<b>きいろのこんぺいとう</b>をひろうと、スコアが+1こ。<br>
        ・<b>赤い影</b>が大きくなったらバケツが来る合図！ めいの手は、<b>ふるえたら</b>おそってくる合図！ その場所から離れよう。<br>
        ・当たるとゲームオーバー。30秒逃げ切ればクリアです。
      </div>

      <div id="controller-status" class="wait">コントローラー: 確認中...</div>
      <div id="best-record"></div>

      <button id="btn-start" class="main-btn">ゲームスタート</button>
    </div>
  </div>

  <div id="result-screen">
    <div id="result-title">めいに捕まった。。。</div>
    <div id="result-sub"></div>
    <div id="result-rank"></div>
    <div id="result-buttons">
      <button id="btn-retry" class="main-btn">もう一度</button>
      <button id="btn-menu" class="sub-btn">待機画面に戻る</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- 待機画面（Menu）/ ステージ2の手（Hands）/ 練習の説明（Tutorial） -->
  <script src="menu.js"></script>
  <script src="hands.js"></script>
  <script src="tutorial.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ===== 調整用の設定 =====
    const GAME_TIME = 30;            // 制限時間（秒）。通常モードの両ステージで共通
    const COUNTDOWN_SECONDS = 3;     // スタート前のカウントダウン（秒）
    const PLAYER_HIT_R = 38;         // めいの手に対するプレイヤーの当たり半径（バケツの判定は別）

    // こんぺいとう
    const KONPEITO_INTERVAL = 10;    // 何秒にひとつ出現するか（最初のひとつはスタート直後）
    const KONPEITO_LIFETIME = 9;     // 出現してから消えるまでの秒数（最後の2秒は点滅）
    const PINK_RATE = 0.5;           // ピンクが出る確率（残りはきいろ）
    const PICKUP_RADIUS = 70;        // ひろえる距離（プレイヤーの中心から）
    const BOOST_DURATION = 3;        // ブーストが続く秒数（ピンクをひろうたびに、ここからやり直し）
    const BOOST_MULTIPLIER = 2.0;    // ブースト中のスピード倍率
    const PRACTICE_COLORS = ['pink', 'yellow']; // 練習モード：最初のふたつは、この順番で出して説明する

    // ステージごとの設定
    //   buckets: 通常モードのバケツ数  start から、every 秒ごとに add ずつ増えて max まで
    //   practiceBuckets: 練習モードのバケツ数（最初から固定）
    //   hands: めいの手が出るか
    const STAGE_CONFIG = {
      1: { buckets: { start: 3, add: 6, every: 10, max: 15 }, practiceBuckets: 6, hands: false },
      2: { buckets: { start: 2, add: 2, every: 10, max: 6 },  practiceBuckets: 3, hands: true }
    };

    const player = document.getElementById('player');
    const info = document.getElementById('info');
    const resultScreen = document.getElementById('result-screen');
    const resultTitle = document.getElementById('result-title');
    const resultSub = document.getElementById('result-sub');
    const resultRank = document.getElementById('result-rank');
    const btnRetry = document.getElementById('btn-retry');
    const btnMenu = document.getElementById('btn-menu');
    const btnQuitPractice = document.getElementById('btn-quit-practice');
    const countdownEl = document.getElementById('countdown');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;

    // ブースト：こんぺいとう（ピンク）をひろうと、boostUntil（ゲーム開始からの秒）まで続く
    let boostActive = false;
    let boostUntil = 0;
    let score = 0;                   // きいろのこんぺいとうの数

    // 画面の状態: 'menu'（待機）/ 'tutorial'（練習の説明）/ 'countdown' / 'playing' / 'result'
    let gameState = 'menu';
    let currentStage = 1;            // 遊んでいるステージ（ゲーム開始時に Menu から取る）
    let currentMode = 'normal';      // 遊んでいるモード（'normal' または 'practice'）
    let playStartTime = 0;
    let lastFrameTime = performance.now();
    let countdownTimer = null;
    let practiceHitCount = 0;        // 練習モードで当たった回数（練習開始ごとにリセット）

    let konpeito = null;             // いま画面にあるこんぺいとう（なければ null）
    let nextKonpeitoAt = 0;          // 次に出す時刻（ゲーム開始からの秒）
    let konpeitoSpawnCount = 0;

    let walkClock = 0;
    let walkIdx = 0;
    let lastMoveAt = 0;
    let walkFrameNo = 1;
    // 全コマを先に読み込んでおく（切り替え時のちらつき防止）
    const walkImgs = [];
    for (let i = 1; i <= 8; i++) { const im = new Image(); im.src = `walk${i}.png`; walkImgs.push(im); }
    function setWalkFrame(n) {
      if (n === walkFrameNo) return;
      walkFrameNo = n;
      player.src = `walk${n}.png`;
    }
    let currentDirection = 'right';

    // バケツシステムの管理
    const buckets = [];
    const maxBuckets = 15;
    let activeBucketCount = 3;
    // 最後のバケツは、ステージ2で「めいの手のすきま」専用に使う
    const reservedBucket = () => buckets[maxBuckets - 1];

    for (let i = 0; i < maxBuckets; i ++) {
      const warningEl = document.createElement('div');
      warningEl.className = 'warning-sign';
      document.body.appendChild(warningEl);

      const img = document.createElement('img');
      img.src = 'bucket.png';
      img.className = 'bucket';
      document.body.appendChild(img);

      buckets.push({
        warningElement: warningEl,
        element: img,
        x: Math.random() * (window.innerWidth - 200) + 100,
        y: Math.random() * (window.innerHeight - 200) + 100,
        state: 'warning',
        timer: 0,
        scale: 0.1,
        speed: 0.004,
        afterimageCounter: 0,
        warnFrames: 240,   // 警告の長さ（フレーム）
        once: false        // true なら、1回落ちたあとは出番を待つ（すきま専用）
      });
    }

    // ===== Firebase：コントローラー入力（傾きのみ。ブーストはこんぺいとうで発動する） =====
    let firstSnapshot = true;

    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x;
        inputY = data.y;
      }
      // 最初のスナップショットは保存済みの値なので、受信とは数えない
      if (firstSnapshot) {
        firstSnapshot = false;
      } else {
        Menu.notifyInput();
      }
    });

    database.ref('.info/connected').on('value', (snapshot) => {
      Menu.setConnected(snapshot.val() === true);
    });

    // ===== 表示まわり =====
    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function updateInfo(elapsed) {
      const boostText = boostActive ? `✨ 残り${Math.max(0, boostUntil - elapsed).toFixed(1)}秒` : 'OFF';
      const common = `スコア: ${score} | バケツ数: ${activeBucketCount} | ブースト: ${boostText}`;
      if (currentMode === 'normal') {
        const timeLeft = Math.max(0, Math.ceil(GAME_TIME - elapsed));
        info.textContent = `ステージ${currentStage} | 残り時間: ${formatTime(timeLeft)} | ${common}`;
      } else {
        info.textContent = `練習モード（ステージ${currentStage}） | 経過時間: ${formatTime(elapsed)} | ${common}`;
      }
    }

    function hideAllBuckets() {
      buckets.forEach((b) => {
        b.warningElement.style.display = 'none';
        b.element.style.display = 'none';
      });
    }

    // ===== こんぺいとう =====
    function removeKonpeito() {
      if (konpeito) {
        konpeito.el.remove();
        konpeito = null;
      }
    }

    function spawnKonpeito(forcedColor) {
      removeKonpeito();
      const color = forcedColor || ((Math.random() < PINK_RATE) ? 'pink' : 'yellow');
      // プレイヤーから少し離れた場所に出す（出た瞬間にひろってしまわないように）
      let x;
      let y;
      let tries = 0;
      do {
        x = 100 + Math.random() * (window.innerWidth - 200);
        y = 130 + Math.random() * (window.innerHeight - 260);
        tries++;
      } while (tries < 20 && Math.hypot(x - (posX + 80), y - (posY + 80)) < 220);

      const el = document.createElement('img');
      el.src = `konpeito-${color}.png`;
      el.className = 'konpeito';
      el.alt = '';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      konpeito = { el: el, x: x, y: y, color: color, born: 0 };
    }

    function showPop(x, y, text, color) {
      const el = document.createElement('div');
      el.className = `pop-text ${color}`;
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    function pickKonpeito(elapsed) {
      const k = konpeito;
      removeKonpeito();
      if (k.color === 'pink') {
        boostUntil = elapsed + BOOST_DURATION;   // クールタイムなし。ひろうたびに時間をやり直す
        showPop(k.x, k.y, 'ブースト！', 'pink');
      } else {
        score++;
        showPop(k.x, k.y, '+1', 'yellow');
      }
    }

    function updateKonpeito(elapsed) {
      // 出現
      if (elapsed >= nextKonpeitoAt) {
        const forced = (currentMode === 'practice') ? PRACTICE_COLORS[konpeitoSpawnCount] : undefined;
        spawnKonpeito(forced);
        konpeito.born = elapsed;
        konpeitoSpawnCount++;
        nextKonpeitoAt += KONPEITO_INTERVAL;
      }
      if (!konpeito) return;

      // 消える・点滅
      const age = elapsed - konpeito.born;
      if (age >= KONPEITO_LIFETIME) {
        removeKonpeito();
        return;
      }
      if (age > KONPEITO_LIFETIME - 2) konpeito.el.classList.add('blink');

      // ひろう
      const dist = Math.hypot(posX + 80 - konpeito.x, posY + 80 - konpeito.y);
      if (dist < PICKUP_RADIUS) pickKonpeito(elapsed);
    }

    // ===== バケツ（1個ぶんの動き。当たったら true を返す） =====
    function stepBucket(b) {
      if (b.state === 'idle') return false;

      if (b.state === 'warning') {
        // 1. 警告フェーズ：影が大きく・濃くなっていく
        b.timer++;
        let progress = b.timer / b.warnFrames;

        b.warningElement.style.display = 'block';
        b.warningElement.style.left = b.x + 'px';
        b.warningElement.style.top = b.y + 'px';

        let warningWidth = 30 + progress * 120;
        let warningHeight = 10 + progress * 50;
        b.warningElement.style.width = warningWidth + 'px';
        b.warningElement.style.height = warningHeight + 'px';

        b.warningElement.style.backgroundColor = `rgba(255, 0, 0, ${0.1 + progress * 0.7})`;
        b.warningElement.style.opacity = 0.2 + progress * 0.8;

        b.element.style.display = 'none';

        if (b.timer >= b.warnFrames) {
          b.state = 'falling';
          b.timer = 0;
          b.warningElement.style.display = 'none';
          b.element.style.display = 'block';
        }

      } else if (b.state === 'falling') {
        // 2. バケツ出現・滞留フェーズ
        b.timer++;

        let finalSize = 500; // バケツの表示サイズ
        b.element.style.width = finalSize + 'px';
        b.element.style.height = finalSize + 'px';
        b.element.style.left = b.x + 'px';
        b.element.style.top = b.y + 'px';

        // ★消える直前に少しだけフェードアウト（徐々に薄くなる）効果を演出
        if (b.timer > 45) {
          b.element.style.opacity = (60 - b.timer) / 15; // 45〜60フレームの間でじわっと消える
        } else {
          b.element.style.opacity = 1.0;
        }

        // 当たり判定（表示されている間中ずっと有効）
        let playerCenterX = posX + 30;
        let playerCenterY = posY + 30;
        let distance = Math.hypot(playerCenterX - b.x, playerCenterY - b.y);

        let bucketRadius = finalSize / 5;
        let playerRadius = 20;

        if (distance < (bucketRadius + playerRadius)) {
          return true;
        }

        // ★表示時間を「60フレーム（約1秒間）」に延ばして残るように修正
        if (b.timer > 60) {
          if (b.once) {
            // すきま専用：1回落ちたら、次の合図まで休む
            b.state = 'idle';
            b.warningElement.style.display = 'none';
            b.element.style.display = 'none';
            b.element.style.opacity = 1.0;
          } else {
            b.state = 'warning';
            b.timer = 0;
            b.x = Math.random() * (window.innerWidth - 200) + 100;
            b.y = Math.random() * (window.innerHeight - 200) + 100;
          }
        }
      }
      return false;
    }

    // ステージ2：めいの手の「すきま」に、バケツを落とす合図
    Hands.setGapBucketHandler((x, y, warnSec) => {
      const b = reservedBucket();
      b.once = true;
      b.warnFrames = Math.max(30, Math.round(warnSec * 60)); // 手が閉じる瞬間に落ちるよう、予告の長さを合わせる
      b.state = 'warning';
      b.timer = 0;
      b.x = x;
      b.y = y;
      b.element.style.opacity = 1.0;
    });

    // ゲーム世界を初期状態に戻す
    function resetGameWorld() {
      const cfg = STAGE_CONFIG[currentStage];
      posX = window.innerWidth / 2;
      posY = window.innerHeight / 2;
      player.style.left = posX + 'px';
      player.style.top = posY + 'px';
      player.classList.remove('boosting');
      currentDirection = 'right';
      walkClock = 0;
      walkIdx = 0;
      lastMoveAt = 0;
      walkFrameNo = 0;
      setWalkFrame(1);

      activeBucketCount = (currentMode === 'practice') ? cfg.practiceBuckets : cfg.buckets.start;
      buckets.forEach((b) => {
        b.state = 'warning';
        b.timer = 0;
        b.warnFrames = 240;
        b.once = false;
        b.x = Math.random() * (window.innerWidth - 200) + 100;
        b.y = Math.random() * (window.innerHeight - 200) + 100;
        b.element.style.opacity = 1.0;
      });
      if (cfg.hands) {
        // ステージ2：最後のバケツは、手の「すきま」が出るまで休ませる
        reservedBucket().state = 'idle';
        reservedBucket().once = true;
      }
      hideAllBuckets();
    }

    // ===== 画面の遷移 =====
    function backToMenu() {
      clearInterval(countdownTimer);
      gameState = 'menu';
      Tutorial.hide();
      Hands.stop();
      removeKonpeito();
      hideAllBuckets();
      clearEffects();
      resultScreen.style.display = 'none';
      countdownEl.style.display = 'none';
      btnQuitPractice.style.display = 'none';
      info.style.display = 'none';
      player.style.display = 'none';
      player.classList.remove('boosting');
      Menu.show();
    }

    function beginGame() {
      clearInterval(countdownTimer);
      currentStage = Menu.stage;
      currentMode = Menu.mode;
      const cfg = STAGE_CONFIG[currentStage];

      Menu.hide();
      Tutorial.hide();
      Hands.stop();
      removeKonpeito();
      clearEffects();
      resultScreen.style.display = 'none';
      info.style.display = 'block';
      player.style.display = 'block';
      btnQuitPractice.style.display = (currentMode === 'practice') ? 'block' : 'none';

      score = 0;
      boostActive = false;
      boostUntil = 0;
      nextKonpeitoAt = 0;      // 最初のこんぺいとうは、ゲーム開始の直後に出る
      konpeitoSpawnCount = 0;

      resetGameWorld();
      updateInfo(0);

      gameState = 'countdown';
      let n = COUNTDOWN_SECONDS;
      countdownEl.textContent = n;
      countdownEl.style.display = 'block';

      countdownTimer = setInterval(() => {
        n--;
        if (n > 0) {
          countdownEl.textContent = n;
        } else {
          clearInterval(countdownTimer);
          countdownEl.textContent = 'スタート！';
          gameState = 'playing';
          playStartTime = performance.now();
          if (cfg.hands) Hands.start();
          setTimeout(() => {
            if (gameState === 'playing') countdownEl.style.display = 'none';
          }, 700);
        }
      }, 1000);
    }

    // ゲーム終了（cleared: 逃げ切りクリアなら true）
    // ===== 称号（こんぺいとうの数で決まる） =====
    const RANKS = [
      { min: 0, name: '見習いくろすけ',     note: 'まずはこんぺいとうを探してみよう' },
      { min: 1, name: 'おつかいくろすけ',   note: 'こんぺいとうをゲット！' },
      { min: 2, name: 'こんぺいとう名人',   note: 'いい集めっぷり！' },
      { min: 3, name: 'くろすけの親分',     note: 'こんぺいとうを集めきった！' }
    ];
    function rankFor(n) {
      let r = RANKS[0];
      for (const x of RANKS) if (n >= x.min) r = x;
      return r;
    }

    // ===== 演出：画面ゆれ・紙吹雪 =====
    let resultTimer = null;
    function clearEffects() {
      clearTimeout(resultTimer);
      document.body.classList.remove('shake');
      document.querySelectorAll('.confetti').forEach((e) => e.remove());
    }
    function startShake() {
      const b = document.body;
      b.classList.remove('shake');
      void b.offsetWidth;
      b.classList.add('shake');
    }
    function launchConfetti() {
      const colors = ['#f2b8c6', '#f7d96a', '#9bd0a0', '#8cc4e8', '#f4a261', '#fbf5e3'];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = colors[i % colors.length];
        c.style.setProperty('--dx', ((Math.random() - 0.5) * 240) + 'px');
        c.style.setProperty('--rot', ((Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 720)) + 'deg');
        c.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
        c.style.animationDelay = (Math.random() * 0.8) + 's';
        c.style.width = (7 + Math.random() * 6) + 'px';
        c.style.height = (11 + Math.random() * 8) + 'px';
        document.body.appendChild(c);
      }
      setTimeout(() => document.querySelectorAll('.confetti').forEach((e) => e.remove()), 6500);
    }

    function endGame(cleared) {
      gameState = 'result';
      clearEffects();
      const elapsed = (performance.now() - playStartTime) / 1000;
      const scoreLine = `こんぺいとうスコア: ${score}こ`;

      if (currentMode === 'normal') {
        const survived = Math.min(elapsed, GAME_TIME);
        const newBestTime = Menu.recordSurvival(survived);
        const newBestScore = Menu.recordScore(score);

        resultTitle.textContent = cleared ? 'めいから逃げ切った！' : 'めいに捕まった。。。';
        resultSub.textContent =
          (cleared ? `クリアタイム: ${GAME_TIME.toFixed(1)}秒` : `生き残った時間: ${survived.toFixed(1)}秒`) +
          `\n${scoreLine}` +
          ((newBestTime || newBestScore) ? '\n🎉 ベスト記録を更新！' : '');
        btnRetry.textContent = 'もう一度';
        btnMenu.textContent = '待機画面に戻る';
      } else {
        practiceHitCount++;
        if (practiceHitCount === 1) {
          // 1回目：チュートリアル説明
          resultTitle.textContent = '当たっちゃった！';
          resultSub.textContent =
            'バケツやめいの手に当たると、\n' +
            'ゲームオーバーになります。\n' +
            '赤い影が大きくなったり、\nめいの手がふるえたら、\n' +
            'その場所から離れましょう。\n' +
            `${scoreLine}\n` +
            'もう一度挑戦してみよう！';
        } else {
          // 2回目以降：ゲームオーバー表示（避ける操作の練習）
          resultTitle.textContent = 'ゲームオーバー';
          resultSub.textContent = `練習時間: ${elapsed.toFixed(1)}秒\n${scoreLine}\n避ける操作を練習しよう！`;
        }
        btnRetry.textContent = 'もう一度挑戦';
        btnMenu.textContent = '練習を終了';
      }
      const rank = rankFor(score);
      resultRank.innerHTML = `称号：「${rank.name}」<small>${rank.note}</small>`;
      resultRank.style.display = 'block';

      if (cleared) {
        resultScreen.style.display = 'block';
        launchConfetti();
      } else {
        // 被弾：画面をゆらしてから結果を出す
        startShake();
        resultScreen.style.display = 'none';
        resultTimer = setTimeout(() => {
          if (gameState === 'result') resultScreen.style.display = 'block';
        }, 500);
      }
    }

    // ===== 結果画面・練習終了のボタン =====
    btnRetry.addEventListener('click', () => {
      if (gameState !== 'result') return;
      beginGame();
    });

    btnMenu.addEventListener('click', backToMenu);
    btnQuitPractice.addEventListener('click', backToMenu);

    function update() {
      requestAnimationFrame(update);
      const nowT = performance.now();
      const dt = Math.min(0.05, (nowT - lastFrameTime) / 1000);
      lastFrameTime = nowT;
      if (gameState !== 'playing') return;

      const elapsed = (nowT - playStartTime) / 1000;
      const cfg = STAGE_CONFIG[currentStage];

      if (currentMode === 'normal') {
        if (elapsed >= GAME_TIME) {
          endGame(true);
          return;
        }
        // バケツ数は、every 秒ごとに add ずつ増える（ステージ1は 3 → 9 → 15）
        const bc = cfg.buckets;
        activeBucketCount = Math.min(bc.max, bc.start + bc.add * Math.floor(elapsed / bc.every));
      }

      // ブースト（ピンクのこんぺいとうをひろうと、BOOST_DURATION 秒だけ自動で入る）
      boostActive = elapsed < boostUntil;
      player.classList.toggle('boosting', boostActive);

      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      let smoothness = boostActive ? 0.3 : 0.02;

      let prevX = posX;
      let prevY = posY;

      // --- 1. スピード・操作感の補正設定 ---
      const deadzone = 3.0;        // スマホの微小な揺れを無視する範囲
      const baseSpeed = 0.005;      // 通常時の移動スピード
      const boostMultiplier = BOOST_MULTIPLIER; // ★ブースト時のスピード倍率（上の調整用の設定で変える）

      // 2. 傾きの取得と持ち手の角度調整
      let rawX = inputX;
      let rawY = inputY - 30; // 縦の持ち方オフセット

      // 3. デッドゾーン（微小な傾きをカットして勝手に動かないようにする）
      if (Math.abs(rawX) < deadzone) rawX = 0;
      if (Math.abs(rawY) < deadzone) rawY = 0;

      let moveX = rawX;
      let moveY = rawY;

      //4.傾けた時の最大スピードの制御
      const maxspeed = 10.0;
      if (Math.abs(rawX) >  maxspeed) rawX = maxspeed;
      if (Math.abs(rawY) >  maxspeed) rawY = maxspeed;

      // 5. ブースト中のスピード適用
      let currentSpeed = boostActive ? (baseSpeed * boostMultiplier) : baseSpeed;

      // 6. 速度を座標に加算して進み続ける処理
      posX += moveX * currentSpeed * 10;
      posY += moveY * currentSpeed * 5;

      posX = Math.max(0, Math.min(window.innerWidth - 160, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 160, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- こんぺいとうの出現・ひろう処理 ---
      updateKonpeito(elapsed);

      // --- 影の拡大とバケツの出現処理 ---
      for (let i = 0; i < activeBucketCount; i++) {
        if (stepBucket(buckets[i])) {
          endGame(false);
          return;
        }
      }
      // ステージ2：めいの手の「すきま」専用バケツ
      if (cfg.hands && stepBucket(reservedBucket())) {
        endGame(false);
        return;
      }

      // --- ステージ2：めいの両手 ---
      if (cfg.hands) {
        if (Hands.update(dt, window.innerWidth, window.innerHeight, posX + 80, posY + 80, PLAYER_HIT_R)) {
          endGame(false);
          return;
        }
      }

      // --- タイマー表示 ---
      updateInfo(elapsed);

      // --- 左右の向きと歩行アニメーション制御 ---
      let moveDelta = posX - prevX;
      if (Math.abs(moveDelta) > 0.001) {
        if (moveDelta > 0) currentDirection = 'right';
        else if (moveDelta < 0) currentDirection = 'left';
      }

      // 歩行アニメ：時間ベースで 4 コマ（右=walk1-4 / 左=walk5-8）を順番に回す
      const movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      if (movedDistance > 0.05) {
        lastMoveAt = nowT;
        walkClock += dt * 1000;
        const stepMs = boostActive ? 70 : 140;
        while (walkClock >= stepMs) {
          walkClock -= stepMs;
          walkIdx = (walkIdx + 1) % 4;
        }
      } else if (nowT - lastMoveAt > 150) {
        walkIdx = 0;      // 少し止まってから立ち姿に戻す（入力の細かい途切れでコマが戻らないように）
        walkClock = 0;
      }
      setWalkFrame((currentDirection === 'right' ? 1 : 5) + walkIdx);
    }

    // 待機画面を初期化して開始（スタートボタンが押されたら、練習なら説明 → ゲーム開始）
    Menu.init({
      gameTime: GAME_TIME,
      onStart: ({ mode, stage }) => {
        if (gameState !== 'menu') return;
        practiceHitCount = 0; // 練習モードを始めるたびにチュートリアルを最初から
        if (mode === 'practice') {
          gameState = 'tutorial';
          Menu.hide();
          Tutorial.show({
            stage: stage,
            boostSec: BOOST_DURATION,
            interval: KONPEITO_INTERVAL,
            onDone: beginGame,
            onBack: backToMenu
          });
        } else {
          beginGame();
        }
      }
    });
    Menu.show();
    update();
  </script>
</body>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - ゲーム画面</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB; /* 空の背景色 */
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    /* まっくろくろすけキャラクター（画像タグとして配置） */
    #player {
      position: absolute;
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div id="info">スマホからのデータ受信待機中...</div>
  <!-- 画像を切り替えて歩かせるためのimg要素 -->
  <img id="player" src="walk1.jpg" alt="まっくろくろすけ">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const player = document.getElementById('player');
    const info = document.getElementById('info');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false;

    // 歩行アニメーション用の設定（全8枚の画像を順番に切り替え）
    let animTimer = 0;
    let frameIndex = 0;
    const totalFrames = 4; 

    // Firebase からデータを受信
    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false;
        info.textContent = `まっくろくろすけ出撃中 [ブースト: ${boostActive ? 'ON 🔥' : 'OFF'}]`;
      }
    });

    // 画面の更新（ゲームループ）
    function update() {
      // 目標座標の計算
      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      // 通常時は「0.02」でかなりゆっくり、ブースト時は「0.3」で高速移動
      let smoothness = boostActive ? 0.3 : 0.02; 

      let prevX = posX;
      let prevY = posY;

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      // 画面外制限
      posX = Math.max(0, Math.min(window.innerWidth - 100, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 100, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- 歩行アニメーションの制御 ---
      let movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      
      if (movedDistance > 0.05) {
        // 動いているときはコマ送りのスピードを調整（通常時はゆっくり、ブースト時はキビキビ）
        animTimer++;
        let interval = boostActive ? 3 : 10; 

        if (animTimer > interval) {
          frameIndex = (frameIndex + 1) % totalFrames;
          // walk1.jpg 〜 walk8.jpg を順番に切り替え
          player.src = `walk${frameIndex + 1}.jpg`;
          animTimer = 0;
        }
      } else {
        // 止まっているときは最初の立ち姿（walk1.jpg）に戻す
        player.src = 'walk1.jpg';
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>君のまっくろくろすけ - 飛び出すバケツ避けサバイバル</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB; /* 空の背景色 */
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      z-index: 10;
    }
    /* まっくろくろすけをさらに大きく（160pxに拡大） */
    #player {
      position: absolute;
      width: 160px;
      height: 160px;
      object-fit: contain;
      z-index: 5;
    }
    /* 残像のスタイル */
    .afterimage {
      position: absolute;
      width: 160px;
      height: 160px;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.3s ease-out;
    }
    /* バケツ落下前の警告マーカー（地面の影やマーク） */
    .warning-sign {
      position: absolute;
      width: 80px;
      height: 30px;
      background: rgba(255, 0, 0, 0.4);
      border: 2px dashed red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 1;
    }
    /* 飛び出してくるバケツ（最初は小さく、手前に来ると大きくなる） */
    .bucket {
      position: absolute;
      object-fit: contain;
      display: none;
      z-index: 4;
    }
    #result-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 32px;
      font-weight: bold;
      display: none;
      text-align: center;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="info">残り時間: 0:30 | バケツ数: 3 | ブースト: OFF</div>
  <img id="player" src="walk1.jpg" alt="まっくろくろすけ">
  
  <div id="result-screen">
    <span id="result-text">GAME OVER 🔥</span><br>
    <span style="font-size: 18px; font-weight: normal; color: #ddd;">画面をリロードして再挑戦！</span>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const player = document.getElementById('player');
    const info = document.getElementById('info');
    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let inputX = 0;
    let inputY = 0;
    let boostActive = false;
    let isGameOver = false;

    let timeLeft = 30; // 制限時間30秒
    let timerCounter = 0;

    let animTimer = 0;
    let rightFrameIndex = 0;
    let leftFrameIndex = 0;
    let currentDirection = 'right';

    let afterimageTimer = 0; // 残像生成用カウンター

    // 「奥から手前へ飛んでくる」バケツシステムの管理
    const buckets = [];
    const maxBuckets = 15;
    let activeBucketCount = 3;

    for (let i = 0; i < maxBuckets; i++) {
      // 警告サイン（印）の生成
      const warningEl = document.createElement('div');
      warningEl.className = 'warning-sign';
      document.body.appendChild(warningEl);

      // バケツ画像の生成
      const img = document.createElement('img');
      img.src = 'bucket.png';
      img.className = 'bucket';
      document.body.appendChild(img);
      
      buckets.push({
        warningElement: warningEl,
        element: img,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        state: 'warning', // 'warning'（警告中） または 'falling'（手前に飛来中）
        timer: 0,         // 状態変化用タイマー
        scale: 0.1,       // 奥から手前に来るにつれて大きくなる倍率
        speed: 0.008      // 【変更】バケツが飛んでくるスピードを遅く設定
      });
    }

    database.ref('player1/move').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        inputX = data.x; 
        inputY = data.y; 
        boostActive = data.boost || false;
      }
    });

    setInterval(() => {
      if (isGameOver) return;

      timeLeft--;
      timerCounter++;

      if (timerCounter % 10 === 0 && activeBucketCount < maxBuckets) {
        activeBucketCount++;
      }

      if (timeLeft <= 0) {
        isGameOver = true;
        resultText.innerHTML = "CLEAR!! 🎊<br><span style='font-size:20px;'>おめでとう！30秒間生き残りました！</span>";
        resultScreen.style.display = 'block';
      }
    }, 1000);

    function update() {
      if (isGameOver) return;

      let targetX = (window.innerWidth / 2) + (inputX * 5);
      let targetY = (window.innerHeight / 2) + ((inputY - 30) * 5);

      let smoothness = boostActive ? 0.3 : 0.02; 

      let prevX = posX;
      let prevY = posY;

      posX += (targetX - posX) * smoothness;
      posY += (targetY - posY) * smoothness;

      // キャラクターが大きくなった分（160px）、画面外の制限を調整
      posX = Math.max(0, Math.min(window.innerWidth - 160, posX));
      posY = Math.max(0, Math.min(window.innerHeight - 160, posY));

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // --- 残像の生成処理 ---
      let movedDistanceCheck = Math.hypot(posX - prevX, posY - prevY);
      if (movedDistanceCheck > 0.5) {
        afterimageTimer++;
        if (afterimageTimer % 3 === 0) { // 一定間隔で残像を残す
          const afterimage = document.createElement('img');
          afterimage.src = player.src;
          afterimage.className = 'afterimage';
          afterimage.style.left = posX + 'px';
          afterimage.style.top = posY + 'px';
          document.body.appendChild(afterimage);

          // 少しずつ透明にして消滅させる
          setTimeout(() => {
            afterimage.style.opacity = '0';
          }, 20);
          setTimeout(() => {
            afterimage.remove();
          }, 320);
        }
      }

      // --- 「手前から飛んでくる」バケツと警告の処理 ---
      for (let i = 0; i < activeBucketCount; i++) {
        let b = buckets[i];

        if (b.state === 'warning') {
          // 1. 警告フェーズ（落下地点に赤く点滅する印を表示）
          b.warningElement.style.display = 'block';
          b.warningElement.style.left = b.x + 'px';
          b.warningElement.style.top = b.y + 'px';
          b.element.style.display = 'none';

          b.timer++;
          // 警告時間を少し長め（約2秒）にして余裕を持たせる
          if (b.timer > 120) {
            b.state = 'falling';
            b.timer = 0;
            b.scale = 0.1; // 最も奥（小さい状態）からスタート
            b.warningElement.style.display = 'none';
            b.element.style.display = 'block';
          }
        } else if (b.state === 'falling') {
          // 2. 落下（手前に飛んでくる）フェーズ
          b.scale += b.speed; // 手前に近づくにつれて大きくなる

          // 画面の手前に到達したときのサイズと位置
          let currentSize = 180 * b.scale;
          b.element.style.width = currentSize + 'px';
          b.element.style.height = currentSize + 'px';
          b.element.style.left = (b.x - currentSize / 2) + 'px';
          b.element.style.top = (b.y - currentSize / 2) + 'px';

          // 手前に到達しきったら（scale >= 1.0）、新しい位置に再セットして再び警告からループ
          if (b.scale >= 1.0) {
            b.state = 'warning';
            b.x = Math.random() * (window.innerWidth - 200) + 100;
            b.y = Math.random() * (window.innerHeight - 200) + 100;
            b.speed = 0.005 + Math.random() * 0.006; // 【変更】遅めのスピードでランダム設定
          }

          // --- 当たり判定（手前に飛び出してきてキャラクターと重なった瞬間） ---
          let hitMargin = 40;
          let playerCenterX = posX + 80;
          let playerCenterY = posY + 80;
          let distance = Math.hypot(playerCenterX - b.x, playerCenterY - b.y);

          // バケツが手前に迫っていて（scaleが大きくなっていて）、距離が近いとき
          if (b.scale > 0.6 && distance < (currentSize / 2 + hitMargin)) {
            isGameOver = true;
            resultText.innerHTML = "GAME OVER 🔥<br><span style='font-size:18px; font-weight:normal; color:#ddd;'>飛んできたバケツに直撃した…！</span>";
            resultScreen.style.display = 'block';
          }
        }
      }

      // --- タイマー表示の修正 ---
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      let formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
      info.textContent = `残り時間: ${minutes}:${formattedSeconds} | バケツ数: ${activeBucketCount} | ブースト: ${boostActive ? '🔥 ON' : 'OFF'}`;

      // --- 左右の向きと歩行アニメーション制御 ---
      let moveDelta = posX - prevX;
      if (Math.abs(moveDelta) > 0.001) {
        if (moveDelta > 0) currentDirection = 'right';
        else if (moveDelta < 0) currentDirection = 'left';
      }

      let movedDistance = Math.abs(posX - prevX) + Math.abs(posY - prevY);
      if (movedDistance > 0.05) {
        animTimer++;
        let interval = boostActive ? 3 : 10; 

        if (animTimer > interval) {
          if (currentDirection === 'right') {
            rightFrameIndex = (rightFrameIndex + 1) % 4;
            player.src = `walk${rightFrameIndex + 1}.jpg`;
          } else {
            leftFrameIndex = (leftFrameIndex + 1) % 4;
            player.src = `walk${5 + leftFrameIndex}.jpg`;
          }
          animTimer = 0;
        }
      } else {
        player.src = (currentDirection === 'right') ? 'walk1.jpg' : 'walk5.jpg';
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>

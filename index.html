<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ（コントローラー）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }
    .who {
      margin: 6px 0 0;
      font-size: 15px;
      color: #ccc;
    }
    .who button {
      font-size: 18px;
      padding: 10px 22px;
      margin: 6px;
      background-color: #444;
      border: 3px solid transparent;
    }
    .who button.selected {
      background-color: #ff4081;
      border-color: #fff;
    }
    .who button.p2.selected {
      background-color: #ff80ab;
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #00e676;
    }
    #hint {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <div class="who">
    あなたは？<br>
    <button id="p1-btn" class="selected">1P</button>
    <button id="p2-btn" class="p2">2P（リボン）</button>
  </div>
  <button id="start-btn">まっくろくろすけと同期</button>
  <div id="status">未接続</div>
  <!-- ブーストは、ゲーム画面でこんぺいとう（ピンク）をひろうと自動で入ります -->
  <div id="hint">1Pか2Pを選んで「まっくろくろすけと同期」を押し、スマホを傾けて動かします。<br>ピンクのこんぺいとうをひろうと、自動でブーストします。</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');

    // 1P / 2P の選択（URL に ?p=2 を付けても選べる）。送り先は player1/move か player2/move
    let playerNo = /[?&]p=2\b/.test(location.search) ? 2 : 1;
    const p1Btn = document.getElementById('p1-btn');
    const p2Btn = document.getElementById('p2-btn');
    function showPlayer() {
      p1Btn.classList.toggle('selected', playerNo === 1);
      p2Btn.classList.toggle('selected', playerNo === 2);
    }
    p1Btn.addEventListener('click', () => { playerNo = 1; showPlayer(); });
    p2Btn.addEventListener('click', () => { playerNo = 2; showPlayer(); });
    showPlayer();

    let currentGamma = 0;
    let currentBeta = 0;

    async function startSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "同期中...";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "同期中...";
      }
    }

    function handleOrientation(event) {
      currentGamma = event.gamma || 0;
      currentBeta = event.beta || 0;
      sendData();
    }

    // 傾きだけを送る（ブーストの情報は、もう送らない）
    function sendData() {
      database.ref('player' + playerNo + '/move').set({
        x: currentGamma,
        y: currentBeta
      });
    }

    startBtn.addEventListener('click', startSensor);
  </script>
</body>
</html>

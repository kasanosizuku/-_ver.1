<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #00e676;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <p>ボタンを押してからスマホを傾けてね！</p>
  <p>※注意！ボタンを押す前にスマホを平行に傾けた状態にしていないと，正確に反映されません。</p>
  <button id="start-btn">ゲームスタート！</button>
  <div id="status">未接続</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ★ここをご自分の firebaseConfig に書き換えてください
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.firebasestorage.app",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');

    async function startSensor() {
      // iOS（iPhone）のセンサー許可申請
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "送信中...";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        // Android / PC等
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "送信中...";
      }
    }

    function handleOrientation(event) {
      const gamma = event.gamma || 0; // 左右傾き (-90 ～ 90)
      const beta = event.beta || 0;   // 前後傾き (-180 ～ 180)

      // 傾き具合によるスピード調整
      database.ref('player1/move').set({
        x: gamma * 0.5, // 半分の感度で穏やかに動く
        y: beta
      });
    }

    startBtn.addEventListener('click', startSensor);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ（コントローラー）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #00e676;
    }
    #hint {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <button id="start-btn">ゲームスタート！</button>
  <div id="status">未接続</div>
  <!-- ブーストは、ゲーム画面でこんぺいとう（ピンク）をひろうと自動で入ります -->
  <div id="hint">スマホを傾けて動かします。<br>ピンクのこんぺいとうをひろうと、自動でブーストします。</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');

    let currentGamma = 0;
    let currentBeta = 0;

    async function startSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "送信中...";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "送信中...";
      }
    }

    function handleOrientation(event) {
      currentGamma = event.gamma || 0;
      currentBeta = event.beta || 0;
      sendData();
    }

    // 傾きだけを送る（ブーストの情報は、もう送らない）
    function sendData() {
      database.ref('player1/move').set({
        x: currentGamma,
        y: currentBeta
      });
    }

    startBtn.addEventListener('click', startSensor);
  </script>
</body>
</html>

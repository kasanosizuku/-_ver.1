<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ（コントローラー）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }
    /* ブーストボタンのデザイン（押している間色が変わる） */
    #boost-btn {
      background-color: #ff9800;
      font-size: 24px;
      padding: 20px 40px;
    }
    #boost-btn.active {
      background-color: #e65100;
      transform: scale(0.95);
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #00e676;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <button id="start-btn">ゲームスタート！</button>
  <br>
  <!-- ★ブーストボタンを追加 -->
  <button id="boost-btn">わっ！</button>
  <div id="status">未接続</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const boostBtn = document.getElementById('boost-btn');
    const statusDiv = document.getElementById('status');

    let currentGamma = 0;
    let currentBeta = 0;
    let isBoosting = false; // ブースト中かどうかのフラグ

    async function startSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "送信中...";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "送信中...";
      }
    }

    function handleOrientation(event) {
      currentGamma = event.gamma || 0;
      currentBeta = event.beta || 0;
      sendData();
    }

    function sendData() {
      database.ref('player1/move').set({
        x: currentGamma,
        y: currentBeta,
        boost: isBoosting // ブーストの状態（true / false）を一緒に送る
      });
    }

    startBtn.addEventListener('click', startSensor);

    // スマホのタッチ操作でブーストボタンのON/OFFを切り替える
    boostBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isBoosting = true;
      boostBtn.classList.add('active');
      sendData();
    });
    boostBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      isBoosting = false;
      boostBtn.classList.remove('active');
      sendData();
    });

    // PCのマウスでもテストできるようにする場合
    boostBtn.addEventListener('mousedown', () => { isBoosting = true; boostBtn.classList.add('active'); sendData(); });
    boostBtn.addEventListener('mouseup', () => { isBoosting = false; boostBtn.classList.remove('active'); sendData(); });
  </script>
</body>
</html>

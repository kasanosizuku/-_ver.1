  <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ（コントローラー）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #00e676;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <p>ボタンを押してからスマホを傾けてね！</p>
  <button id="start-btn">ゲームスタート！</button>
  <div id="status">未接続</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');

    let lastSendTime = 0;

    async function startSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "送信中（傾きモード）";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "送信中（傾きモード）";
      }
    }

    function handleOrientation(event) {
      const gamma = event.gamma || 0; 
      const beta = event.beta || 0;   

      // データの送信頻度を少し抑えて通信の詰まりを防ぐ（約50ミリ秒に1回）
      const now = Date.now();
      if (now - lastSendTime < 50) return;
      lastSendTime = now;

      const speedMultiplier = 0.03; // ← この数値を変えてみてください！
      
      const adjustedX = gamma * speedMultiplier;
      const adjustedY = beta * speedMultiplier;

      // 補正をかけたスピードそのものをFirebaseに送る
      database.ref('player1/move').set({
        x: adjustedX,
        y: adjustedY
      });
    }

    startBtn.addEventListener('click', startSensor);
  </script>
</body>
</html>

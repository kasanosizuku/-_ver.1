<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のまっくろくろすけ（コントローラー）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: #222;
      color: #fff;
    }
    button {
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }
    /* ブーストボタン（通常・アクティブ・クールダウン中） */
    #boost-btn {
      background-color: #ff9800;
      font-size: 24px;
      padding: 20px 40px;
      transition: background-color 0.2s;
    }
    #boost-btn.active {
      background-color: #e65100;
      transform: scale(0.95);
    }
    #boost-btn:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      color: #00e676;
    }
    #cooldown-info {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #ffeb3b;
    }
  </style>
</head>
<body>

  <h1>君のまっくろくろすけ</h1>
  <button id="start-btn">ゲームスタート！</button>
  <br>
  <!-- ブーストボタン ＆ クールタイム表示 -->
  <button id="boost-btn">わっ！</button>
  <div id="cooldown-info"></div>
  <div id="status">未接続</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyD1pVotHvYA_Abc0lwxxYMzlMkePwBx89A",
     authDomain: "bunnkasai-test-c9f1d.firebaseapp.com",
     databaseURL: "https://bunnkasai-test-c9f1d-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "bunnkasai-test-c9f1d",
     storageBucket: "bunnkasai-test-c9f1d.appspot.com",
     messagingSenderId: "626413070465",
     appId: "1:626413070465:web:2cb19f7bb88d1fd2240580",
     measurementId: "G-JJNMNWL4M1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const boostBtn = document.getElementById('boost-btn');
    const statusDiv = document.getElementById('status');
    const cooldownInfo = document.getElementById('cooldown-info');

    let currentGamma = 0;
    let currentBeta = 0;
    let isBoosting = false;

    // クールタイム・ブースト管理用タイマー変数
    let boostTimer = null;
    let cooldownTimer = null;
    let remainingCooldown = 0;

    async function startSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusDiv.textContent = "送信中...";
          } else {
            alert("センサーの使用が拒否されました");
          }
        } catch (error) {
          console.error(error);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        statusDiv.textContent = "送信中...";
      }
    }

    function handleOrientation(event) {
      currentGamma = event.gamma || 0;
      currentBeta = event.beta || 0;
      sendData();
    }

    function sendData() {
      database.ref('player1/move').set({
        x: currentGamma,
        y: currentBeta,
        boost: isBoosting
      });
    }

    startBtn.addEventListener('click', startSensor);

    // ブーストボタンが押されたときの処理
    boostBtn.addEventListener('click', () => {
      // すでにブースト中、またはクールダウン中なら無視
      if (isBoosting || remainingCooldown > 0) return;

      // --- ① ブースト発動（5秒間） ---
      isBoosting = true;
      boostBtn.classList.add('active');
      boostBtn.textContent = "ブースト中！ (5s)";
      sendData();

      let boostLeft = 5;
      boostTimer = setInterval(() => {
        boostLeft--;
        if (boostLeft > 0) {
          boostBtn.textContent = `ブースト中！ (${boostLeft}s)`;
        } else {
          clearInterval(boostTimer);
          // --- ② ブースト終了 → クールタイム開始（15秒） ---
          isBoosting = false;
          boostBtn.classList.remove('active');
          sendData();

          startCooldown(15);
        }
      }, 1000);
    });

    // クールタイムを管理・表示する関数
    function startCooldown(seconds) {
      remainingCooldown = seconds;
      boostBtn.disabled = true;
      boostBtn.textContent = `クールタイム中`;
      cooldownInfo.textContent = `残りクールタイム: ${remainingCooldown}秒`;

      cooldownTimer = setInterval(() => {
        remainingCooldown--;
        if (remainingCooldown > 0) {
          cooldownInfo.textContent = `残りクールタイム: ${remainingCooldown}秒`;
        } else {
          clearInterval(cooldownTimer);
          remainingCooldown = 0;
          boostBtn.disabled = false;
          boostBtn.textContent = "ブースト！";
          cooldownInfo.textContent = "ブースト準備完了！";
          setTimeout(() => { cooldownInfo.textContent = ""; }, 2000);
        }
      }, 1000);
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe0c3"/>
      <stop offset="1" stop-color="#f0bf95"/>
    </linearGradient>
  </defs>
  <!-- そで（左はしは画面の外へのびる） -->
  <rect x="-6" y="50" width="178" height="120" fill="#8fb573" stroke="#5f8a4b" stroke-width="2"/>
  <path d="M44 53 Q58 110 44 167 M98 53 Q112 110 98 167" fill="none" stroke="#76a05d" stroke-width="3" stroke-linecap="round"/>
  <!-- そでぐち -->
  <rect x="160" y="44" width="38" height="132" rx="13" fill="#fbf5e3" stroke="#8a6a43" stroke-width="3"/>
  <!-- うで -->
  <path d="M196 64 L352 70 L352 154 L196 158 Z" fill="url(#skin)" stroke="#b07f52" stroke-width="3" stroke-linejoin="round"/>
  <!-- おやゆび -->
  <rect x="392" y="36" width="100" height="32" rx="16" transform="rotate(-12 392 52)" fill="url(#skin)" stroke="#b07f52" stroke-width="3"/>
  <!-- てのひら -->
  <path d="M340 68 Q408 52 470 62 L470 166 Q408 176 340 156 Z" fill="url(#skin)" stroke="#b07f52" stroke-width="3" stroke-linejoin="round"/>
  <!-- ゆび（ひとさしゆび → こゆび） -->
  <rect x="440" y="62" width="168" height="28" rx="14" fill="url(#skin)" stroke="#b07f52" stroke-width="3"/>
  <rect x="440" y="88" width="182" height="28" rx="14" fill="url(#skin)" stroke="#b07f52" stroke-width="3"/>
  <rect x="440" y="114" width="170" height="28" rx="14" fill="url(#skin)" stroke="#b07f52" stroke-width="3"/>
  <rect x="440" y="140" width="144" height="26" rx="13" fill="url(#skin)" stroke="#b07f52" stroke-width="3"/>
  <!-- つめ -->
  <g fill="#fde8dc" stroke="#e5b79a" stroke-width="1.5">
    <ellipse cx="594" cy="76" rx="8" ry="6.5"/>
    <ellipse cx="608" cy="102" rx="8" ry="6.5"/>
    <ellipse cx="596" cy="128" rx="8" ry="6.5"/>
    <ellipse cx="571" cy="153" rx="7" ry="6"/>
  </g>
  <!-- かるいかげ -->
  <path d="M352 150 Q408 168 466 160" fill="none" stroke="#e0a97c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
